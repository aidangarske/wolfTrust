name: STM32H563 M33MU guest tests

on:
  push:
    branches: [master, main, "release/**", wolfpsa-v5.9.1-ci]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zephyr-m33mu:
    name: Zephyr guest (${{ matrix.config.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - board: nucleo_h563zi/stm32h563xx/ns
            shared_uart: 3
    container:
      image: ghcr.io/wolfssl/wolfboot-ci-m33mu:v1.15
    env:
      CROSS_COMPILE: /usr/local/bin/arm-none-eabi-
      ZEPHYR_TOOLCHAIN_VARIANT: cross-compile
      ZEPHYR_BOARD: ${{ matrix.config.board }}
      WT_SHARED_UART: ${{ matrix.config.shared_uart }}
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf git@github.com:

      - name: Initialize firmware dependencies
        run: |
          git submodule update --init \
            lib/wolfHSM \
            lib/wolfPKCS11 \
            lib/wolfPSA \
            lib/wolfSSL \
            lib/wolfhal

      - name: Boot and test Zephyr guest
        run: |
          make -C tests/firmware/zephyr-stm32h5 \
            EMU_TIMEOUT=300 \
            run-uarts

  freertos-m33mu:
    name: FreeRTOS guest (${{ matrix.config.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - board: nucleo_h563zi/stm32h563xx/ns
            shared_uart: 3
    container:
      image: ghcr.io/wolfssl/wolfboot-ci-m33mu:v1.15
    env:
      CROSS_COMPILE: /usr/local/bin/arm-none-eabi-
      ZEPHYR_TOOLCHAIN_VARIANT: cross-compile
      ZEPHYR_BOARD: ${{ matrix.config.board }}
      WT_SHARED_UART: ${{ matrix.config.shared_uart }}
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf git@github.com:

      - name: Initialize firmware dependencies
        run: |
          git submodule update --init \
            lib/wolfHSM \
            lib/wolfPKCS11 \
            lib/wolfPSA \
            lib/wolfSSL \
            lib/wolfhal

      - name: Boot and test FreeRTOS guest
        run: |
          make -C tests/firmware/zephyr-stm32h5 \
            EMU_TIMEOUT=300 \
            zephyr-freertos-uarts

  wolfboot-m33mu:
    name: wolfBoot (${{ matrix.config.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: stm32h5-tz-psa
            board: nucleo_h563zi/stm32h563xx/ns
    timeout-minutes: 30
    container:
      image: ghcr.io/wolfssl/wolfboot-ci-m33mu:v1.15
    env:
      # wolfBoot PR #831: wolfCOSE-backed PSA/DICE attestation integration.
      # Keep this pinned until the PR is merged, then move to upstream master.
      WOLFBOOT_REF: 9b9ca53454732c5385de764bfcfd192335c997a2
      ZEPHYR_BOARD: ${{ matrix.config.board }}
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf git@github.com:

      - name: Fetch pinned wolfBoot and dependencies
        run: |
          git clone --no-checkout https://github.com/wolfSSL/wolfBoot.git wolfBoot
          git -C wolfBoot fetch --depth 1 origin "$WOLFBOOT_REF"
          git -C wolfBoot checkout --detach "$WOLFBOOT_REF"
          git -C wolfBoot submodule update --init --single-branch

      - name: Build signed STM32H5 TrustZone wolfBoot image
        working-directory: wolfBoot
        run: |
          cp "config/examples/${{ matrix.config.name }}.config" .config
          make -j2

      - name: Boot signed image under M33MU
        working-directory: wolfBoot
        run: |
          m33mu wolfboot.bin \
            test-app/image_v1_signed.bin:0x60000 \
            --uart-stdout --expect-bkpt 0x7f --timeout 600 \
            | tee "$RUNNER_TEMP/wolfboot-m33mu.log"
          grep -q "\\[BKPT\\] imm=0x7f" "$RUNNER_TEMP/wolfboot-m33mu.log"
          grep -q "\\[EXPECT BKPT\\] Success" "$RUNNER_TEMP/wolfboot-m33mu.log"

      - name: Run wolfBoot update and rollback lifecycle
        working-directory: wolfBoot
        env:
          SCENARIOS: A,B,C
          TARGET: stm32h5
          BOOT_TIMEOUT: 30
          UPDATE_TIMEOUT: 30
          REBOOT_TIMEOUT: 30
        run: |
          ./test-app/emu-test-apps/test.sh

  wolfboot-wolftrust-m33mu:
    name: wolfBoot + wolfTrust secure handoff
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/wolfssl/wolfboot-ci-m33mu:v1.15
    env:
      # wolfBoot fork branch containing the H5 secure-app handoff.
      WOLFBOOT_REF: b2ed05f2
      WT_SECURE_FLASH_BASE: 0x0C020000
      WT_SECURE_FLASH_SIZE: 0x00020000
      WT_SECURE_IMAGE_HEADER_SIZE: 0x400
      WT_MAX_GUESTS: 2
      ZEPHYR_BOARD: nucleo_h563zi/stm32h563xx/ns
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf git@github.com:

      - name: Initialize wolfTrust dependencies
        run: git submodule update --init --single-branch

      - name: Prepare Zephyr and FreeRTOS workspaces
        working-directory: tests/firmware/zephyr-stm32h5
        run: make clone

      - name: Fetch secure-app wolfBoot
        run: |
          git clone --no-checkout https://github.com/aidangarske/wolfBoot.git wolfBoot
          git -C wolfBoot fetch --depth 1 origin "$WOLFBOOT_REF"
          git -C wolfBoot checkout --detach "$WOLFBOOT_REF"
          git -C wolfBoot submodule update --init --single-branch

      - name: Build wolfBoot secure first stage
        working-directory: wolfBoot
        run: |
          cp config/examples/stm32h5-tz-wolftrust.config .config
          make -j2 keytools wolfboot.bin wolfboot_signing_private_key.der

      - name: Build relocated wolfTrust and both guests
        run: |
          make build/wolftrust.bin build/secure_cmse_implib.o
          make -C tests/firmware/zephyr-stm32h5 \
            build-guest0-psa build-freertos-guest1

      - name: Sign wolfTrust secure runtime
        working-directory: wolfBoot
        run: |
          IMAGE_HEADER_SIZE=1024 \
          WOLFBOOT_PARTITION_SIZE=0x20000 \
          WOLFBOOT_SECTOR_SIZE=0x2000 \
            ./tools/keytools/sign --ecc256 \
              "$GITHUB_WORKSPACE/build/wolftrust.bin" \
              wolfboot_signing_private_key.der 1
          test -s "$GITHUB_WORKSPACE/build/wolftrust_v1_signed.bin"

      - name: Boot the authenticated wolfBoot → wolfTrust → guests chain
        run: |
          set -o pipefail
          m33mu wolfBoot/wolfboot.bin \
            build/wolftrust_v1_signed.bin:0x20000 \
            tests/firmware/zephyr-stm32h5/build/guest0_psa/zephyr/zephyr.bin:0x40000 \
            tests/firmware/zephyr-stm32h5/build/freertos_guest1/freertos_guest1.bin:0x60000 \
            --uart-stdout --quit-on-faults --timeout 600 \
            | tee "$RUNNER_TEMP/wolfboot-wolftrust-m33mu.log"
          grep -Fq "wolfTrust TEE client initialized" "$RUNNER_TEMP/wolfboot-wolftrust-m33mu.log"
          grep -Fq "psa_cipher_encrypt(SHA-256)" "$RUNNER_TEMP/wolfboot-wolftrust-m33mu.log" || \
            grep -Fq "psa_cipher_encrypt(AES-CTR)" "$RUNNER_TEMP/wolfboot-wolftrust-m33mu.log"
          grep -Fq "freertos_guest1: C_Digest(SHA-256) rv=0" "$RUNNER_TEMP/wolfboot-wolftrust-m33mu.log"

CONFIG_BUILD_WITH_TFM=n
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
# ES256 verification uses a large SP math frame on Cortex-M33.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_TRUSTED_EXECUTION_NONSECURE=y
CONFIG_UART_CONSOLE=y
CONFIG_WOLFTRUST_ZEPHYR=y
CONFIG_TEE=y
CONFIG_WOLFTRUST_TEE_DRIVER=y
CONFIG_WOLFTRUST_WOLFHSM_CLIENT=y
CONFIG_WOLFPSA=y

name: STM32H563 M33MU guest tests

on:
  push:
    branches: [master, main, "release/**", wolfpsa-v5.9.1-ci]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zephyr-m33mu:
    name: Zephyr guest (${{ matrix.config.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - board: nucleo_h563zi/stm32h563xx/ns
            shared_uart: 3
    container:
      image: ghcr.io/wolfssl/wolfboot-ci-m33mu:v1.15
    env:
      CROSS_COMPILE: /usr/local/bin/arm-none-eabi-
      ZEPHYR_TOOLCHAIN_VARIANT: cross-compile
      ZEPHYR_BOARD: ${{ matrix.config.board }}
      WT_SHARED_UART: ${{ matrix.config.shared_uart }}
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf git@github.com:

      - name: Initialize firmware dependencies
        run: |
          git submodule update --init \
            lib/wolfHSM \
            lib/wolfPKCS11 \
            lib/wolfPSA \
            lib/wolfSSL \
            lib/wolfhal

      - name: Boot and test Zephyr guest
        run: |
          make -C tests/firmware/zephyr-stm32h5 \
            EMU_TIMEOUT=300 \
            run-uarts

  freertos-m33mu:
    name: FreeRTOS guest (${{ matrix.config.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - board: nucleo_h563zi/stm32h563xx/ns
            shared_uart: 3
    container:
      image: ghcr.io/wolfssl/wolfboot-ci-m33mu:v1.15
    env:
      CROSS_COMPILE: /usr/local/bin/arm-none-eabi-
      ZEPHYR_TOOLCHAIN_VARIANT: cross-compile
      ZEPHYR_BOARD: ${{ matrix.config.board }}
      WT_SHARED_UART: ${{ matrix.config.shared_uart }}
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf git@github.com:

      - name: Initialize firmware dependencies
        run: |
          git submodule update --init \
            lib/wolfHSM \
            lib/wolfPKCS11 \
            lib/wolfPSA \
            lib/wolfSSL \
            lib/wolfhal

      - name: Boot and test FreeRTOS guest
        run: |
          make -C tests/firmware/zephyr-stm32h5 \
            EMU_TIMEOUT=300 \
            zephyr-freertos-uarts

  wolfboot-m33mu:
    name: wolfBoot (${{ matrix.config.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: stm32h5-tz-psa
            board: nucleo_h563zi/stm32h563xx/ns
    timeout-minutes: 30
    container:
      image: ghcr.io/wolfssl/wolfboot-ci-m33mu:v1.15
    env:
      WOLFBOOT_REF: 0a8ad18e51ae247a71b140dabe5bb8dfef38419a
      ZEPHYR_BOARD: ${{ matrix.config.board }}
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf git@github.com:

      - name: Fetch pinned wolfBoot and dependencies
        run: |
          git clone --no-checkout https://github.com/wolfSSL/wolfBoot.git wolfBoot
          git -C wolfBoot fetch --depth 1 origin "$WOLFBOOT_REF"
          git -C wolfBoot checkout --detach "$WOLFBOOT_REF"
          git -C wolfBoot submodule update --init --single-branch

      - name: Build signed STM32H5 TrustZone wolfBoot image
        working-directory: wolfBoot
        run: |
          cp "config/examples/${{ matrix.config.name }}.config" .config
          make -j2

      - name: Boot signed image under M33MU
        working-directory: wolfBoot
        run: |
          m33mu wolfboot.bin \
            test-app/image_v1_signed.bin:0x60000 \
            --uart-stdout --expect-bkpt 0x7f --timeout 600 \
            | tee "$RUNNER_TEMP/wolfboot-m33mu.log"
          grep -q "\\[BKPT\\] imm=0x7f" "$RUNNER_TEMP/wolfboot-m33mu.log"
          grep -q "\\[EXPECT BKPT\\] Success" "$RUNNER_TEMP/wolfboot-m33mu.log"

      - name: Run wolfBoot update and rollback lifecycle
        working-directory: wolfBoot
        env:
          SCENARIOS: A,B,C
          TARGET: stm32h5
          BOOT_TIMEOUT: 30
          UPDATE_TIMEOUT: 30
          REBOOT_TIMEOUT: 30
        run: |
          ./test-app/emu-test-apps/test.sh
